provider:
  name: docker
server:
  port: 10000
  base-path: /
storage:
  file: /etc/sablier/state.json
sessions:
  default-duration: 5m
  expiration-interval: 20s
logging:
  level: debug
strategy:
  dynamic:
    custom-themes-path:
    show-details-by-default: true
    default-theme: ghost
    default-refresh-frequency: 5s
  blocking:
    default-timeout: 1m